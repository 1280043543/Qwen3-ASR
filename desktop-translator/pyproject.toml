[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-local-subtitles"
version = "0.1.0"
description = "Local Windows desktop subtitles using Qwen3-ASR"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7",
  "requests>=2.32",
  "soundcard>=0.4.3",
]

[project.optional-dependencies]
desktop = [
  "qwen-asr>=0.0.6",
  "torch>=2.6",
]

[project.scripts]
qwen-local-subtitles = "qwen_local_subtitles.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen_local_subtitles*"]
